<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f7f5"><title>Dein Weg nach der Schule – Demo</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b26;background:#f3f7f5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px 14px}.shell{width:min(100%,440px);background:white;border:1px solid #dce6e1;border-radius:26px;box-shadow:0 14px 45px #173f2c12;padding:25px 22px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:13px;background:#176d57;color:white;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:15px}.brand small{color:#60736b;font-size:12px}.divider{height:1px;background:#e6ede9;margin:20px 0}.pill{font-size:11px;font-weight:750;letter-spacing:.08em;color:#20765e}.hero{text-align:center;padding:15px 0 4px}.hero .emoji{font-size:43px}.hero h1{font-size:29px;line-height:1.17;margin:15px 0}.hero p{color:#4e6259;line-height:1.55}.info{background:#f3f7f5;border-radius:16px;padding:15px;margin:22px 0;display:grid;gap:13px}.info div{display:flex;gap:11px;align-items:center;font-size:14px}.info span{font-size:20px}.btn{appearance:none;border:0;border-radius:13px;background:#176d57;color:white;padding:15px 19px;font-size:16px;font-weight:700;cursor:pointer;min-height:52px}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.secondary{background:white;color:#365348;border:1px solid #cbdad2}.btn.full{width:100%}.muted{text-align:center;color:#71837b;font-size:12px;margin:14px 0 0}.progress{display:flex;gap:5px;margin-bottom:21px}.progress span{height:6px;flex:1;background:#e3eae6;border-radius:5px}.progress span.active{background:#16846b}.question h1{font-size:23px;line-height:1.35;margin:12px 0 24px}.options{display:grid;gap:10px}.option{width:100%;min-height:57px;text-align:left;border:1.5px solid #d7e1dc;background:#fff;border-radius:13px;padding:14px;display:flex;align-items:center;gap:13px;font:inherit;font-size:15px;cursor:pointer;color:#233a30}.option.selected{background:#e8f5ef;border-color:#16846b;font-weight:650}.circle{width:21px;height:21px;border-radius:50%;border:2px solid #b5c6bd;display:grid;place-items:center;flex-shrink:0}.selected .circle{background:#16846b;border-color:#16846b;color:white}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.controls .btn{flex:1}.footer{text-align:center;font-size:12px;color:#72827a;line-height:1.5;margin-top:19px}.consent h1{font-size:24px;margin:12px 0}.consent p{line-height:1.55;color:#4e6259}.consent-list{padding-left:20px;line-height:1.65;color:#365348}.consent-list li{margin:8px 0}.consent-check{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1.5px solid #cbdad2;border-radius:13px;margin:20px 0;line-height:1.5;cursor:pointer}.consent-check input{width:23px;height:23px;flex-shrink:0;accent-color:#176d57}.complete{text-align:center;padding:34px 0 18px}.complete .check{font-size:55px}.complete h1{font-size:27px}.complete p{line-height:1.5;color:#52665c}button:focus-visible{outline:3px solid #76bba5;outline-offset:3px}@media(max-width:380px){.shell{padding:20px 16px}.hero h1{font-size:26px}.question h1{font-size:21px}}@media(prefers-reduced-motion:no-preference){.view{animation:enter .2s ease-out}@keyframes enter{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body><main class="shell"><header class="brand"><div class="logo" aria-hidden="true">🎓</div><div><strong>Dein Weg nach der Schule</strong><small>Beispielbefragung · Universität Bern</small></div></header><div class="divider"></div><section id="app" aria-live="polite"></section></main>
<script>
'use strict';
// Ausschliesslich lokale Demo: kein Backend, keine Cookies, kein localStorage, keine Analyse-Skripte.
const questions=[
{q:'Wie geht es dir, wenn du an deine berufliche Zukunft denkst?',options:['Sehr gut','Eher gut','Mal so, mal so','Eher schlecht','Sehr schlecht']},
{q:'Wie stressig ist die Suche nach einer Lehrstelle für dich?',options:['Überhaupt nicht stressig','Ein wenig stressig','Mittelmässig stressig','Ziemlich stressig','Sehr stressig']},
{q:'Wie sicher bist du, dass du eine passende Lehrstelle findest?',options:['Gar nicht sicher','Eher unsicher','Teils, teils','Eher sicher','Sehr sicher']},
{q:'Hast du in den letzten vier Wochen eine Bewerbung für eine Lehrstelle verschickt?',options:['Ja','Nein','Ich suche noch nicht nach einer Lehrstelle']},
{q:'Wie gut weisst du, was du nach der Schule machen möchtest?',options:['Sehr gut','Eher gut','Teils, teils','Eher nicht','Überhaupt nicht']},
{q:'Wenn du bei der Lehrstellensuche Hilfe brauchst, weisst du, an wen du dich wenden kannst?',options:['Ja, auf jeden Fall','Eher ja','Ich bin nicht sicher','Eher nein','Nein, überhaupt nicht']},
{q:'Wie gut fühlst du dich bei der Berufswahl unterstützt?',options:['Sehr gut','Eher gut','Teils, teils','Eher schlecht','Überhaupt nicht']},
{q:'Wie oft hast du dir in den letzten zwei Wochen Sorgen um deine Zukunft gemacht?',options:['Nie','Selten','Manchmal','Oft','Sehr oft']}
];
let step=-1;let answers={};let consent=false;const app=document.getElementById('app');
function el(tag,cls,txt){const node=document.createElement(tag);if(cls)node.className=cls;if(txt!==undefined)node.textContent=txt;return node}
function btn(label,cls,callback,disabled=false){const b=el('button','btn '+cls,label);b.type='button';b.disabled=disabled;b.addEventListener('click',callback);return b}
function render(){app.replaceChildren();const view=el('div','view');app.append(view);
if(step===-1){const hero=el('div','hero');hero.append(el('div','emoji','💬'),el('h1','', 'Wie läuft es bei dir?'),el('p','', 'Wir möchten wissen, wie Jugendliche die Suche nach einer Lehrstelle erleben und welche Unterstützung ihnen hilft.'));view.append(hero);const info=el('div','info');[['⏱','Dauert ungefähr 3 Minuten'],['🤝','Die Teilnahme ist freiwillig'],['🛡','Deine Antworten beeinflussen deine Beratung nicht']].forEach(([icon,text])=>{const line=el('div');line.append(el('span','',icon),el('span','',text));info.append(line)});view.append(info,btn('Los geht’s →','full',()=>{step=-2;render()}),el('p','muted','Demo – keine Datenübermittlung'));return}
if(step===-2){const section=el('div','consent');section.append(el('div','pill','INFORMATIONEN ZUR TEILNAHME'),el('h1','','Bevor es losgeht …'),el('p','','Wir möchten wissen, wie Jugendliche die Suche nach einer Lehrstelle erleben. Bitte lies dir diese Informationen durch.'));const list=el('ul','consent-list');['Du entscheidest selbst, ob du mitmachen möchtest.','Du kannst jederzeit aufhören, ohne einen Grund zu nennen.','Deine Entscheidung hat keinen Einfluss auf die Beratung beim BIZ.','Diese Demo speichert oder versendet keine Antworten.'].forEach(t=>list.append(el('li','',t)));section.append(list);const label=el('label','consent-check');const check=document.createElement('input');check.type='checkbox';check.checked=consent;check.addEventListener('change',()=>{consent=check.checked;render()});label.append(check,el('span','','Ich habe die Informationen gelesen und möchte die Demo freiwillig ausprobieren.'));section.append(label);const controls=el('div','controls');controls.append(btn('← Zurück','secondary',()=>{step=-1;render()}),btn('Weiter →','',()=>{step=0;render()},!consent));section.append(controls,el('p','muted','Nur Demonstration – keine rechtlich verbindliche Einwilligung.'));view.append(section);return}
if(step===questions.length){const end=el('div','complete');end.append(el('div','check','✓'),el('h1','', 'Vielen Dank!'),el('p','',`Du hast ${Object.keys(answers).length} von ${questions.length} Fragen beantwortet.`),el('p','', 'Das war nur eine Demonstration. Es wurden keine Antworten gespeichert oder versendet.'));view.append(end,btn('Noch einmal ansehen','full',()=>{step=-1;answers={};consent=false;render()}));return}
const progress=el('div','progress');progress.setAttribute('aria-label',`Frage ${step+1} von ${questions.length}`);questions.forEach((_,i)=>progress.append(el('span',i<=step?'active':'')));view.append(progress,el('div','pill',`FRAGE ${step+1} VON ${questions.length}`));const section=el('div','question');section.append(el('h1','',questions[step].q));const options=el('div','options');questions[step].options.forEach((answer,i)=>{const selected=answers[step]===i;const option=el('button','option'+(selected?' selected':''));option.type='button';option.setAttribute('aria-pressed',String(selected));option.append(el('span','circle',selected?'✓':''),el('span','',answer));option.addEventListener('click',()=>{answers[step]=i;render()});options.append(option)});section.append(options);view.append(section);const controls=el('div','controls');controls.append(btn('← Zurück','secondary',()=>{step--;render()}),btn(step===questions.length-1?'Abschliessen':'Weiter →','',()=>{step++;render()},answers[step]===undefined));view.append(controls,el('div','footer','Beispielhafte Fragen – noch keine validierten Messinstrumente.'))}
render();
</script></body></html>
